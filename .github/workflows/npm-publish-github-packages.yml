name: CI

on:
  push:
    branches:
      - main
      - master
      - "copilot/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Database tests
        run: python tests/database_test.py

      - name: Build
        run: npm run build
